name: Build Vercel artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Rewrite static asset URLs for CDN hosting
        run: |
          python - <<'PY'
          from pathlib import Path
          base = 'https://cdn.jsdelivr.net/gh/MuhamedZanabal/gods-eye-view@live-dist'
          replacements = [
              ('/assets/', base + '/assets/'),
              ('/models/', base + '/models/'),
              ('/cesium/', base + '/cesium/'),
              ('/logo.svg', base + '/logo.svg'),
              ('/pin.svg', base + '/pin.svg'),
              ('/mic.svg', base + '/mic.svg'),
              ('/location.svg', base + '/location.svg'),
              ('/visual-presets.svg', base + '/visual-presets.svg'),
          ]
          for path in Path('dist').rglob('*'):
              if path.is_file() and path.suffix.lower() in {'.html', '.js', '.css'}:
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  for source, target in replacements:
                      text = text.replace(source, target)
                  path.write_text(text, encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vercel-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
      - name: Publish compiled assets to live-dist branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b live-dist
          git add -A
          git commit -m 'deploy: publish compiled live assets'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-dist
